<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Font classes in tailwind</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body>
    <p class="font-sans">Utkarsh</p>
    <p class="font-serif">Pratap</p>
    <p class="font-mono">Singh</p>

    <p class="text-9xl">Utkarsh</p>
    <p class="text-8xl">Pratap</p>
    <p class="text-7xl">Singh</p>
    <p class="text-6xl">Utkarsh</p>
    <p class="text-5xl">Pratap</p>
    <p class="text-4xl">Singh</p>
    <p class="text-3xl">Utkarsh</p>
    <p class="text-2xl">Pratap</p>
    <p class="text-xl">Singh</p>

    <p class="text-9xl font-thin">Utkarsh</p>
    <p class="text-8xl font-extrabold">Pratap</p>
    <p class="text-7xl font-extralight">Singh</p>
    <p class="text-6xl font-light">Utkarsh</p>
    <p class="text-5xl font-semibold">Pratap</p>
    <p class="text-4xl font-bold">Singh</p>
    <p class="text-3xl font-medium">Utkarsh</p>
    <p class="text-2xl font-stretch-50%">Pratap</p>
    <p class="text-xl font-black">Singh</p>
  </body>
</html>
