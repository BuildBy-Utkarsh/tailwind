<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation with Tailwind</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body>
    <div
      class="size-15 bg-red-600 mt-10 ml-10 rounded-full animate-bounce"
    ></div>
    <hr />
    <img class="w-32 m-32 animate-spin" src="spin.png" alt="spinner" />
    <hr />
    <div
      class="size-15 bg-green-600 mt-10 ml-10 rounded-full animate-ping"
    ></div>
    <hr />
    <div
      class="size-15 bg-yellow-600 mt-10 ml-10 rounded-full animate-pulse"
    ></div>
    <hr />
  </body>
</html>
