<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition in tailwind</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body>
    <button class="bg-blue-300 p-2 m-10 text-white rounded hover:bg-blue-900">
      login
    </button>
    <button
      class="bg-blue-300 p-2 m-10 text-white rounded hover:opacity-5 transition duration-1000"
    >
      sign up
    </button>
    <button
      class="bg-red-500 p-2 m-10 text-white rounded hover:rotate-180 transition-transform duration-1700"
    >
      <a href="#">Click me</a>
    </button>
    <button
      class="bg-red-500 p-2 m-10 text-white rounded hover:scale-x-150 hover:scale-y-90 transition-transform duration-1000"
    >
      Click me
    </button>
    <img
      class="h-90 ml-50 hover:rotate-180 hover:scale-125 transition-transform duration-1000"
      src="hero.png"
      alt="hero"
    />
  </body>
</html>
