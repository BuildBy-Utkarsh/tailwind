<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filters</title>
    <link rel="stylesheet" href="output.css">
</head>
<body>
    <img class=" h-150" src="hero.png" alt="hero"/>
    <img class="blur h-150" src="hero.png" />
    <img class="blur-sm h-150" src="hero.png" />
    <img class="blur-md h-150" src="hero.png" />
    <img class="blur-lg h-150" src="hero.png" />
    <img class="blur-2xl h-150" src="hero.png" />
    <img class="brightness-50 h-150" src="hero.png" />
    <img class="brightness-100 h-150" src="hero.png" />
    <img class="brightness-120 h-150" src="hero.png" />
    <img class="brightness-200 h-150" src="hero.png" />
    <h1>Contrast</h1>
    <img class="contrast-0 h-150" src="hero.png" />
    <img class="contrast-50 h-150" src="hero.png" />
    <img class="contrast-100 h-150" src="hero.png" />
    <img class="contrast-125 h-150" src="hero.png" />
    <img class="contrast-200 h-150" src="hero.png" />
    <h1>gray scale</h1>
    <img class="grayscale-0 h-150" src="hero.png" />
    <img class="grayscale-50 h-150" src="hero.png" />
    <img class="grayscale-100 h-150" src="hero.png" />
    <img class="grayscale-125 h-150" src="hero.png" />
    <img class="grayscale-200 h-150" src="hero.png" />
    <h1>invert</h1>
    <img class="invert h-150" src="hero.png" />
    <img class="invert-50 h-150" src="hero.png" />
    <img class="invert-125 h-150" src="hero.png" />
    <img class="invert-200 h-150" src="hero.png" />
    
    <h1>Hue</h1>
    <img class="hue-rotate-0 h-150" src="hero.png" />
    <img class="hue-rotate-15 h-150" src="hero.png" />
    <img class="hue-rotate-30 h-150" src="hero.png" />
    <img class="hue-rotate-60 h-150" src="hero.png" />
    <img class="hue-rotate-90 h-150" src="hero.png" />
    <img class="hue-rotate-180 h-150" src="hero.png" />
</body>
</html>
